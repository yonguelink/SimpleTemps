[Metadata]
Author=yonguelink

@include1=#@#Style.inc

; ----------------------------------
; MEASURES return some kind of value
; ----------------------------------

[measureRAM]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=Value0

; ----------------------------------
; METERS display images, text, bars, etc.
; ----------------------------------

[meterLabelRAM]
Meter=String
MeterStyle=styleTitle
Text=RAM

[meterValueRAM]
Meter=String
MeterStyle=styleValue
MeasureName=measureRAM
Text=%1
Percentual=1
Y=7
